name: Engineering checks (synthetic only)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: Local behavior and browser checks (no source compatibility claim)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the tested Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Remove committed reports before this run
        run: rm -f reports/engineering.json reports/e2e.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, build, and test engineering behavior
        run: npm test
      - name: Install the pinned Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium --only-shell
      - name: Run actual browser journeys
        run: npm run test:e2e
      - name: Upload only this run's engineering reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-synthetic-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/engineering.json
            reports/e2e.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
